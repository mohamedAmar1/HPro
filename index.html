<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From My Heart to Eternity</title>
    <style>
        /* إعدادات الخلفية العامة - تم تحسين الأداء */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #25001a, #05000a);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1000px;
        }

        /* حاوية النجوم والأشعة - تم تخفيفها لتبرز القلب */
        .universe-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* أشعة ناعمة جداً وغير مشتتة */
        .light-rays {
            position: absolute;
            width: 140%;
            height: 140%;
            top: -20%;
            left: -20%;
            background-image: repeating-conic-gradient(from 0deg, transparent 0deg 20deg, rgba(255, 105, 180, 0.02) 20deg 40deg);
            animation: rotateRays 60s linear infinite;
            opacity: 0.6;
        }

        @keyframes rotateRays {
            100% { transform: rotate(360deg); }
        }

        /* تحسين أداء النجوم بتبسيط الظلال لتقليل ثقل الموقع */
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 12px #ff69b4;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: 0;
            will-change: transform, opacity; /* تحسين أداء المتصفح */
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff, 0 0 20px #ff1a40; }
        }

        /* الحاوية الرئيسية (المسرح) */
        .scene {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 60px 80px;
            border-radius: 30px;
            background: rgba(5, 0, 10, 0.75);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* إطار الألوان المتوهج والمتحرك */
        .scene::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(45deg, #ff1a40, #ff69b4, #b3001e, #ff69b4, #ff1a40);
            background-size: 300%;
            border-radius: 33px;
            z-index: -1;
            animation: borderGlow 6s linear infinite;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* تصميم حاوية القلب */
        .heart-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 5;
        }

        .heart-wrapper:hover {
            transform: scale(1.05);
        }

        .heart-half {
            position: absolute;
            width: 100px;
            height: 160px;
            background: linear-gradient(to bottom, #ff1a40, #b3001e);
            border-radius: 100px 100px 0 0;
            box-shadow: 0 0 25px rgba(255, 26, 64, 0.6);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart-left {
            left: 100px;
            transform-origin: 0% 100%;
            transform: rotate(-45deg);
        }

        .heart-right {
            left: 0;
            transform-origin: 100% 100%;
            transform: rotate(45deg);
        }

        /* حركة فتح القلب */
        .heart-wrapper.open .heart-left {
            transform: rotate(-75deg) translate(-45px, -20px);
            opacity: 0.7;
        }

        .heart-wrapper.open .heart-right {
            transform: rotate(75deg) translate(45px, -20px);
            opacity: 0.7;
        }

        /* نبض القلب */
        .heart-wrapper.pulse {
            animation: heartbeat 1.5s infinite ease-in-out;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        /* حاوية الاسم الجديد المقسم لحروف */
        .name-container {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 20;
        }

        /* تأثير حروف الاسم المتطايرة والمتموجة */
        .letter {
            display: inline-block;
            font-size: 4.5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 15px #ff69b4, 0 0 30px #ff1a40;
            opacity: 0;
            transform: scale(0) translateY(-100px) rotate(720deg);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* فئة يتم إضافتها عبر الـ JS لجعل الحروف تظهر بشكل متموج */
        .letter.animate-in {
            opacity: 1;
            transform: scale(1) translateY(0) rotate(0deg);
        }

        /* فئة عند سحب الحروف لداخل القلب واختفائها */
        .letter.animate-out {
            opacity: 0;
            transform: scale(0) translateY(60px) rotate(-180deg);
            transition: all 0.7s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        /* الرسالة الختامية */
        .final-message {
            font-size: 1.8rem;
            color: #ffe6eb;
            font-style: italic;
            text-align: center;
            opacity: 0;
            height: 0;
            overflow: hidden;
            transform: translateY(20px);
            transition: all 1s ease;
            text-shadow: 0 0 15px rgba(255, 230, 235, 0.8);
        }

        .final-message.reveal {
            opacity: 1;
            height: auto;
            margin-top: 40px;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="audio.mp3" loop></audio>

    <div class="universe-container" id="universeContainer">
        <div class="light-rays"></div>
    </div>

    <div class="scene">
        <div class="heart-wrapper pulse" id="heartWrapper">
            <div class="heart-half heart-left"></div>
            <div class="heart-half heart-right"></div>
        </div>

        <div class="name-container" id="nameContainer"></div>

        <div class="final-message" id="finalMessage">From my heart to eternity, Habiba.</div>
        <div class="final-message" id="finalMessage">Eng Mohammed Ammar</div>
    </div>

    <script>
        // 1. توليد النجوم بأداء محسن وسلس (تقليل العدد لـ 60 نجمة سريعة وخفيفة)
        const universeContainer = document.getElementById('universeContainer');
        const starCount = 60;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1.5;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 2 + 1.5}s`);
            star.style.animationDelay = `${Math.random() * 3}s`;
            universeContainer.appendChild(star);
        }

        // 2. إعدادات الاسم والحركات التكرارية
        const heartWrapper = document.getElementById('heartWrapper');
        const nameContainer = document.getElementById('nameContainer');
        const finalMessage = document.getElementById('finalMessage');
        const bgMusic = document.getElementById('bgMusic');

        const nameText = "Habiba";
        let isAnimating = false; // يمنع الضغط فقط أثناء سير حركة الـ 10 ثوانٍ

        // دالة لبناء الحروف وتطييرها
        function triggerNameAnimation() {
            nameContainer.innerHTML = ''; // تنظيف الحروف القديمة
            
            // تحويل النص إلى حروف منفصلة داخل سبانات Spans
            nameText.split('').forEach((char, index) => {
                const span = document.createElement('span');
                span.textContent = char;
                span.classList.add('letter');
                nameContainer.appendChild(span);

                // إظهار الحروف بتأثير موجي متتالي (Delay بسيط بين كل حرف وحرف)
                setTimeout(() => {
                    span.classList.add('animate-in');
                }, index * 120); // 120 مللي ثانية بين كل حرف لتعطي مظهر رائع
            });
        }

        // دالة لإخفاء الحروف لداخل القلب
        function removeNameAnimation() {
            const letters = document.querySelectorAll('.letter');
            letters.forEach((span, index) => {
                setTimeout(() => {
                    span.classList.remove('animate-in');
                    span.classList.add('animate-out');
                }, index * 80); // دخول تدريجي سريع للقلب
            });
        }

        // حدث الضغط على القلب (قابل للتكرار الآن)
        heartWrapper.addEventListener('click', () => {
            if (isAnimating) return; // يمنع التخريب إذا كانت الحركة تعمل بالفعل
            isAnimating = true;

            // تشغيل الموسيقى
            bgMusic.play().catch(() => {});

            // إخفاء الرسالة الختامية القديمة إذا كانت ظاهرة لتهيئة المشهد من جديد
            finalMessage.classList.remove('reveal');

            // فتح القلب
            heartWrapper.classList.remove('pulse');
            heartWrapper.classList.add('open');

            // تشغيل حركة الحروف المتطايرة الأنيقة
            setTimeout(() => {
                triggerNameAnimation();
            }, 400);

            // بعد 10 ثوانٍ كاملة: تبدأ مرحلة العودة والإغلاق
            setTimeout(() => {
                // سحب الحروف لداخل القلب
                removeNameAnimation();

                // إغلاق القلب بعد اختفاء الحروف تماماً
                setTimeout(() => {
                    heartWrapper.classList.remove('open');
                    
                    setTimeout(() => { 
                        heartWrapper.classList.add('pulse'); 
                        isAnimating = false; // هنا نفتح الإمكانية للمستخدم ليضغط مرة أخرى!
                    }, 800);
                    
                    // إظهار الرسالة الختامية
                    setTimeout(() => {
                        finalMessage.classList.add('reveal');
                    }, 400);

                }, 1200); 

            }, 10000); 
        });
    </script>
</body>
</html>
