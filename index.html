<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From My Heart to Eternity</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. الإعدادات العامة والخلفية
           ========================================= */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0d0614, #2a0835, #4d1036, #140727);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            /* الخط الأساسي للموقع */
            font-family: 'Poppins', sans-serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================
           2. الهيدر (Header)
           ========================================= */
        .header {
            width: 100%;
            text-align: center;
            padding: 30px 0;
            /* استخدام الخط الانسيابي الجديد */
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #ffffff;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1a40;
            z-index: 10;
            letter-spacing: 2px;
        }

        /* =========================================
           3. الفضاء والنجوم 
           ========================================= */
        .universe-container {
            position: fixed; width: 100%; height: 100%;
            top: 0; left: 0; pointer-events: none; z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 5px #fff, 0 0 10px #ff8ebf;
            animation: twinkle var(--duration) infinite ease-in-out;
            will-change: opacity, transform;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* =========================================
           4. الحاويات (Cards)
           ========================================= */
        .cards-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            z-index: 10;
            padding: 20px;
            margin-top: auto;
            margin-bottom: auto;
        }

        .card {
            position: relative;
            width: 300px;
            height: 190px;
            background: linear-gradient(135deg, #8E2145, #B32959);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.05), 0 15px 35px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            z-index: 10;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: inset 0 0 15px rgba(255,255,255,0.1), 0 20px 40px rgba(0,0,0,0.6);
        }

        .card-heart {
            width: 50px;
            height: 50px;
            background: #ED184A;
            position: relative;
            transform: rotate(-45deg);
            box-shadow: 0 0 30px rgba(237, 24, 74, 0.8);
            transition: transform 0.3s;
        }

        .card-heart::before, .card-heart::after {
            content: '';
            width: 50px;
            height: 50px;
            background: #ED184A;
            border-radius: 50%;
            position: absolute;
        }

        .card-heart::before { top: -25px; left: 0; }
        .card-heart::after { top: 0; left: 25px; }

        .card:hover .card-heart {
            animation: pulseCard 1s infinite;
        }

        @keyframes pulseCard {
            0%, 100% { transform: rotate(-45deg) scale(1); }
            50% { transform: rotate(-45deg) scale(1.15); }
        }

        .card-title {
            position: absolute;
            bottom: -35px;
            font-size: 1.3rem;
            color: #ffdce5;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            opacity: 0.9;
            letter-spacing: 1px;
        }

        /* =========================================
           5. أنيميشن الاسم
           ========================================= */
        .name-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; z-index: 50; flex-wrap: nowrap;
        }

        .letter {
            display: inline-block;
            /* استخدام الخط الانسيابي للاسم */
            font-family: 'Dancing Script', cursive;
            font-size: 6rem; 
            color: #ffffff;
            text-shadow: 0 0 15px #ff69b4, 0 0 25px #ff1a40;
            opacity: 0;
            transform: scale(0) translateY(-100px) rotate(720deg);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, opacity;
        }

        .letter.animate-in { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        .letter.animate-out { opacity: 0; transform: scale(0) translateY(60px) rotate(-180deg); }

        /* =========================================
           6. النوافذ المنبثقة للمحتوى (Modals)
           ========================================= */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 2, 15, 0.9);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100;
            opacity: 0; visibility: hidden;
            transition: all 0.5s ease;
        }

        .modal.active {
            opacity: 1; visibility: visible;
        }

        .close-btn {
            position: absolute;
            top: 30px; right: 30px;
            font-size: 3rem; color: #fff;
            cursor: pointer; transition: 0.3s;
            z-index: 110;
        }
        
        .close-btn:hover { color: #ff1a40; transform: scale(1.2); }

        .content-container {
            position: relative;
            width: 360px; height: 360px;
            border-radius: 20px;
            padding: 5px; box-sizing: border-box;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rgbPan 4s linear infinite;
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.active .content-container { transform: scale(1); }

        .content-container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: inherit; background-size: inherit; animation: inherit; 
            border-radius: inherit; filter: blur(20px); z-index: -1; opacity: 0.9;
        }

        @keyframes rgbPan {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .content-container img, .content-container video {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 15px; display: block; position: relative; z-index: 1;
            background-color: #000;
        }

        .text-message {
            /* استخدام الخط الانسيابي لرسالة الحب */
            font-family: 'Dancing Script', cursive;
            font-size: 3rem; 
            color: #ffdce5; 
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
            line-height: 1.4;
            padding: 0 20px;
        }

        .image-caption {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            text-align: center; font-size: 1.8rem; font-weight: 900;
            background: linear-gradient(90deg, #ff1a40, #ff69b4, #ffcf33, #0edf73, #0ff2c1, #ff1a40);
            background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: textGradient 3s linear infinite; z-index: 16;
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.9));
        }

        @keyframes textGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* =========================================
           7. الفوتر (Footer)
           ========================================= */
        .footer {
            width: 100%;
            text-align: center;
            padding: 20px 0;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            z-index: 10;
            background: transparent;
        }

        /* =========================================
           8. استجابة التصميم (Responsive)
           ========================================= */
        @media (max-width: 768px) {
            .header { font-size: 2.8rem; padding: 20px 0; }
            .cards-wrapper { flex-direction: column; gap: 40px; margin-top: 2vh; }
            .letter { font-size: 4rem; }
            .content-container { width: 300px; height: 300px; }
            .image-caption { font-size: 1.5rem; }
            .text-message { font-size: 2.2rem; }
        }

        @media (max-width: 400px) {
            .header { font-size: 2.2rem; }
            .letter { font-size: 3rem; }
            .content-container { width: 260px; height: 260px; }
            .text-message { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="audio.mp3" loop></audio>
    <audio id="secondMusic" src="ertahtelk.mp3"></audio>
    <audio id="sound1Audio" src="SOUND1.mp3"></audio>

    <div class="universe-container" id="universeContainer"></div>

    <header class="header">Mohammed & Habiba</header>

    <div class="name-overlay" id="nameContainer"></div>

    <div class="cards-wrapper">
        <div class="card" data-target="modal-text">
            <div class="card-heart"></div>
            <div class="card-title">Message</div>
        </div>
        <div class="card" data-target="modal-image">
            <div class="card-heart"></div>
            <div class="card-title">Memory</div>
        </div>
        <div class="card" data-target="modal-video">
            <div class="card-heart"></div>
            <div class="card-title">Moments</div>
        </div>
    </div>

    <div class="modal" id="modal-text">
        <span class="close-btn" onclick="closeModal('modal-text')">&times;</span>
        <div class="text-message">
            From my heart to eternity, Habiba.<br><br>
            Mohammed Ammar
        </div>
    </div>

    <div class="modal" id="modal-image">
        <span class="close-btn" onclick="closeModal('modal-image')">&times;</span>
        <div class="content-container">
            <img src="back.jpeg" alt="Second Image">
            <div class="image-caption">23/6/2026</div>
        </div>
    </div>

    <div class="modal" id="modal-video">
        <span class="close-btn" onclick="closeModal('modal-video')">&times;</span>
        <div class="content-container">
            <video id="myVideo" src="your-video.mp4" playsinline controls></video>
        </div>
    </div>

    <footer class="footer">
        powered by AI Engineer Mohammed Ammar
    </footer>

    <script>
        // 1. توليد النجوم 
        const universeContainer = document.getElementById('universeContainer');
        const starCount = window.innerWidth <= 768 ? 25 : 40; 
        
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 2 + 2}s`);
            star.style.animationDelay = `${Math.random() * 3}s`;
            fragment.appendChild(star);
        }
        universeContainer.appendChild(fragment);

        // 2. تحضير حروف الاسم
        const nameContainer = document.getElementById('nameContainer');
        const nameText = "Habiba  Helal";
        const lettersFragment = document.createDocumentFragment();
        
        nameText.split('').forEach(char => {
            const span = document.createElement('span');
            span.innerHTML = char === ' ' ? '&nbsp;' : char;
            span.classList.add('letter');
            lettersFragment.appendChild(span);
        });
        nameContainer.appendChild(lettersFragment);
        const letterElements = document.querySelectorAll('.letter');

        // 3. التحكم في الأنيميشن والمودلز
        const bgMusic = document.getElementById('bgMusic');
        const secondMusic = document.getElementById('secondMusic');
        const myVideo = document.getElementById('myVideo');
        const sound1Audio = document.getElementById('sound1Audio');
        let isAnimating = false;

        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', function() {
                if (isAnimating) return;
                isAnimating = true;

                const targetModalId = this.getAttribute('data-target');
                
                bgMusic.play().catch(() => {});

                letterElements.forEach((span, index) => {
                    span.classList.remove('animate-out');
                    setTimeout(() => span.classList.add('animate-in'), index * 100);
                });

                setTimeout(() => {
                    letterElements.forEach((span, index) => {
                        setTimeout(() => {
                            span.classList.remove('animate-in');
                            span.classList.add('animate-out');
                        }, index * 60);
                    });

                    setTimeout(() => {
                        openModal(targetModalId);
                        isAnimating = false;
                    }, 1000); 

                }, 3000); 
            });
        });

        function openModal(modalId) {
            bgMusic.pause();
            if(secondMusic) secondMusic.pause();
            if(myVideo) myVideo.pause();
            if(sound1Audio) sound1Audio.pause();

            document.getElementById(modalId).classList.add('active');

            if (modalId === 'modal-text') {
                if(sound1Audio) {
                    sound1Audio.currentTime = 0;
                    sound1Audio.play().catch(() => {});
                }
            } else if (modalId === 'modal-image') {
                if(secondMusic) {
                    secondMusic.currentTime = 0;
                    secondMusic.play().catch(() => {});
                }
            } else if (modalId === 'modal-video') {
                if(myVideo) {
                    myVideo.currentTime = 0;
                    myVideo.play().catch(() => {});
                }
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            
            bgMusic.pause();
            if(secondMusic) secondMusic.pause();
            if(myVideo) myVideo.pause();
            if(sound1Audio) sound1Audio.pause();
        }
    </script>
</body>
</html>
