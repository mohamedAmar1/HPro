<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From My Heart to Eternity</title>
    <style>
        /* =========================================
           1. الإعدادات العامة والخلفية المتدرجة
           ========================================= */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0d0614, #2a0835, #4d1036, #140727);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1000px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================
           2. صورة الخلفية الشفافة 
           ========================================= */
        .bg-image-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('your-bg-image.jpg'); 
            background-size: cover;
            background-position: center;
            opacity: 0.15; 
            z-index: 0; 
            pointer-events: none; 
        }

        /* =========================================
           3. الفضاء والنجوم والأشعة
           ========================================= */
        .universe-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .light-rays {
            position: absolute;
            width: 140%;
            height: 140%;
            top: -20%;
            left: -20%;
            background-image: repeating-conic-gradient(from 0deg, transparent 0deg 20deg, rgba(255, 105, 180, 0.03) 20deg 40deg);
            animation: rotateRays 80s linear infinite;
        }

        @keyframes rotateRays {
            100% { transform: rotate(360deg); }
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 5px #fff, 0 0 10px #ff8ebf;
            animation: twinkle var(--duration) infinite ease-in-out;
            opacity: 0;
            will-change: transform, opacity;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px #fff, 0 0 15px #ff1a40; }
        }

        /* =========================================
           4. المسرح (المربع الذي يحتوي على العناصر)
           ========================================= */
        .scene {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 70px 90px;
            border-radius: 35px;
            background: rgba(10, 2, 15, 0.6);
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            overflow: visible; 
            box-sizing: border-box; 
        }

        .scene::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff1a40, #900020, #ff69b4, #900020, #ff1a40);
            background-size: 300%;
            border-radius: 37px;
            z-index: -1;
            animation: borderGlow 8s linear infinite;
            opacity: 0.7;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================
           5. القلب النابض وحركته
           ========================================= */
        .heart-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.4s ease;
            z-index: 5;
        }

        .heart-wrapper:hover {
            transform: scale(1.08);
        }

        .heart-half {
            position: absolute;
            width: 100px;
            height: 160px;
            background: linear-gradient(to bottom, #ff1e45, #a3001c);
            border-radius: 100px 100px 0 0;
            box-shadow: 0 0 30px rgba(255, 30, 69, 0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart-left { left: 100px; transform-origin: 0% 100%; transform: rotate(-45deg); }
        .heart-right { left: 0; transform-origin: 100% 100%; transform: rotate(45deg); }

        .heart-wrapper.open .heart-left { transform: rotate(-75deg) translate(-45px, -20px); opacity: 0.6; }
        .heart-wrapper.open .heart-right { transform: rotate(75deg) translate(45px, -20px); opacity: 0.6; }

        .heart-wrapper.pulse {
            animation: heartbeat 1.8s infinite ease-in-out;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* =========================================
           6. الاسم (حروف متطايرة)
           ========================================= */
        .name-container {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 20;
            width: 100%;
            flex-wrap: nowrap;
        }

        .letter {
            display: inline-block;
            font-size: 4.8rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 15px #ff69b4, 0 0 25px #ff1a40;
            opacity: 0;
            transform: scale(0) translateY(-100px) rotate(720deg);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .letter.animate-in {
            opacity: 1;
            transform: scale(1) translateY(0) rotate(0deg);
        }

        .letter.animate-out {
            opacity: 0;
            transform: scale(0) translateY(60px) rotate(-180deg);
            transition: all 0.7s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        /* =========================================
           7. حاوية الصورة وحاوية الفيديو (مشتركة التنسيق)
           ========================================= */
        #postClickImageContainer, #postClickVideoContainer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 360px;
            height: 360px;
            transform: translate(-50%, -50%) scale(0);
            border-radius: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 15;
            padding: 5px; 
            box-sizing: border-box;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rgbPan 4s linear infinite;
        }

        #postClickImageContainer::before, #postClickVideoContainer::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit; 
            background-size: inherit;
            animation: inherit; 
            border-radius: inherit;
            filter: blur(20px); 
            z-index: -1;
            opacity: 0.9;
        }

        @keyframes rgbPan {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* تنسيق الصورة والفيديو ليملأ المربع */
        #postClickImageContainer img, #postClickVideoContainer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            display: block;
            position: relative;
            z-index: 1;
        }

        .image-caption {
            position: absolute;
            bottom: 20px; 
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 2.2rem; 
            font-weight: 900;
            background: linear-gradient(90deg, #ff1a40, #ff69b4, #ffcf33, #0edf73, #0ff2c1, #ff1a40);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGradient 3s linear infinite;
            z-index: 16;
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.9));
        }

        @keyframes textGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* حالة الظهور للصورة والفيديو */
        #postClickImageContainer.image-reveal, #postClickVideoContainer.image-reveal {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        /* =========================================
           8. الرسائل الختامية
           ========================================= */
        .final-message {
            font-size: 1.6rem;
            color: #ffdce5;
            font-style: italic;
            text-align: center;
            opacity: 0;
            height: 0;
            overflow: hidden;
            transform: translateY(20px);
            transition: all 1s ease;
            text-shadow: 0 0 12px rgba(255, 230, 235, 0.6);
            letter-spacing: 1px;
        }

        .final-message.reveal {
            opacity: 1;
            height: auto;
            margin-top: 30px;
            transform: translateY(0);
        }

        /* =========================================
           9. استجابة التصميم للموبايل (Media Queries)
           ========================================= */
        @media (max-width: 768px) {
            .scene {
                padding: 40px 20px; 
                width: 90%; 
            }
            .letter {
                font-size: 2.4rem; 
            }
            #postClickImageContainer, #postClickVideoContainer {
                width: 300px; 
                height: 300px;
            }
            .image-caption {
                font-size: 1.8rem; 
                bottom: 15px;
            }
            .final-message {
                font-size: 1.3rem; 
            }
        }

        @media (max-width: 400px) {
            .letter {
                font-size: 1.8rem;
            }
            #postClickImageContainer, #postClickVideoContainer {
                width: 260px;
                height: 260px;
            }
            .image-caption {
                font-size: 1.5rem;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="audio.mp3" loop></audio>
    <audio id="secondMusic" src="ertahtelk.mp3"></audio>

    <div class="bg-image-overlay"></div>

    <div class="universe-container" id="universeContainer">
        <div class="light-rays"></div>
    </div>

    <div class="scene">
        <div class="heart-wrapper pulse" id="heartWrapper">
            <div class="heart-half heart-left"></div>
            <div class="heart-half heart-right"></div>
        </div>

        <div class="name-container" id="nameContainer"></div>

        <div id="postClickImageContainer">
            <img src="back.jpeg" alt="Second Image">
            <div class="image-caption">Elfatha 23/6/2026</div>
        </div>

        <div id="postClickVideoContainer">
            <video id="myVideo" src="your-video.mp4" playsinline></video>
        </div>

        <div class="final-message">From my heart to eternity, Habiba.</div>
        <div class="final-message">Mohammed Ammar</div>
    </div>

    <script>
        // توليد النجوم
        const universeContainer = document.getElementById('universeContainer');
        const starCount = 65;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 2 + 2}s`);
            star.style.animationDelay = `${Math.random() * 3}s`;
            universeContainer.appendChild(star);
        }

        // تعريف العناصر
        const heartWrapper = document.getElementById('heartWrapper');
        const nameContainer = document.getElementById('nameContainer');
        const finalMessages = document.querySelectorAll('.final-message');
        const postClickImageContainer = document.getElementById('postClickImageContainer');
        const postClickVideoContainer = document.getElementById('postClickVideoContainer');
        const bgMusic = document.getElementById('bgMusic');
        const secondMusic = document.getElementById('secondMusic');
        const myVideo = document.getElementById('myVideo');

        const nameText = "Habiba  Helal";
        let isAnimating = false;
        let clickCount = 0;
        let resetTimer;

        // دالة لإعادة الموقع لنقطة البداية (الصفر)
        function resetSiteToBeginning() {
            postClickImageContainer.classList.remove('image-reveal');
            postClickVideoContainer.classList.remove('image-reveal');
            finalMessages.forEach(msg => msg.classList.remove('reveal'));
            
            if (secondMusic) {
                secondMusic.pause();
                secondMusic.currentTime = 0;
            }
            if (myVideo) {
                myVideo.pause();
                myVideo.currentTime = 0;
            }
            
            clickCount = 0;
            isAnimating = false; // فك قفل الأنيميشن
        }

        function triggerNameAnimation() {
            nameContainer.innerHTML = '';
            nameText.split('').forEach((char, index) => {
                const span = document.createElement('span');
                if(char === ' ') {
                    span.innerHTML = '&nbsp;';
                } else {
                    span.textContent = char;
                }
                span.classList.add('letter');
                nameContainer.appendChild(span);

                setTimeout(() => {
                    span.classList.add('animate-in');
                }, index * 120);
            });
        }

        function removeNameAnimation() {
            const letters = document.querySelectorAll('.letter');
            letters.forEach((span, index) => {
                setTimeout(() => {
                    span.classList.remove('animate-in');
                    span.classList.add('animate-out');
                }, index * 80);
            });
        }

        // التفاعل مع النقرات
        heartWrapper.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;
            clickCount++;

            // مسح أي مؤقت سابق للتأكد من عدم التداخل
            clearTimeout(resetTimer);

            if (clickCount === 1) {
                // ===============================
                // الضغطة الأولى: حركة الحروف (Habiba Helal)
                // ===============================
                finalMessages.forEach(msg => msg.classList.remove('reveal'));
                postClickImageContainer.classList.remove('image-reveal');
                postClickVideoContainer.classList.remove('image-reveal');

                bgMusic.play().catch(() => {});
                
                heartWrapper.classList.remove('pulse');
                heartWrapper.classList.add('open');

                setTimeout(() => {
                    triggerNameAnimation();
                }, 400);

                setTimeout(() => {
                    removeNameAnimation();
                    
                    setTimeout(() => {
                        heartWrapper.classList.remove('open');
                        
                        setTimeout(() => { 
                            heartWrapper.classList.add('pulse'); 
                            isAnimating = false; // السماح بالضغطة الثانية
                        }, 800);
                        
                        setTimeout(() => {
                            finalMessages.forEach(msg => msg.classList.add('reveal'));
                        }, 400);

                    }, 1200); 
                }, 10000); 

            } else if (clickCount === 2) {
                // ===============================
                // الضغطة الثانية: ظهور الصورة مباشرة مع أغنية Ertahtelk
                // ===============================
                bgMusic.pause();
                bgMusic.currentTime = 0; 
                if (secondMusic) secondMusic.play().catch(() => {});

                // إظهار الصورة والرسائل الختامية
                setTimeout(() => {
                    postClickImageContainer.classList.add('image-reveal');
                    finalMessages.forEach(msg => msg.classList.add('reveal'));
                    
                    // نفك قفل الأنيميشن لكي يتمكن من الضغط مرة ثالثة براحته
                    isAnimating = false;
                }, 100);

                // بعد 40 ثانية (إذا لم يضغط الضغطة الثالثة) يرجع للصفر
                resetTimer = setTimeout(() => {
                    resetSiteToBeginning();
                }, 40000); 

            } else if (clickCount === 3) {
                // ===============================
                // الضغطة الثالثة: إخفاء الصورة وظهور الفيديو
                // ===============================
                
                // إيقاف أغنية الضغطة الثانية
                if (secondMusic) {
                    secondMusic.pause();
                    secondMusic.currentTime = 0;
                }

                // إخفاء حاوية الصورة
                postClickImageContainer.classList.remove('image-reveal');

                // تشغيل الفيديو فوراً مع الضغطة لتجنب حظر المتصفح (Autoplay Policy)
                myVideo.play().catch((err) => {
                    console.log("خطأ في تشغيل الفيديو:", err);
                });

                // إظهار حاوية الفيديو بعد جزء من الثانية لنعومة الحركة
                setTimeout(() => {
                    postClickVideoContainer.classList.add('image-reveal');
                }, 300);

                // عندما ينتهي الفيديو، يعود الموقع لنقطة البداية (الصفر) تلقائياً
                myVideo.onended = () => {
                    resetSiteToBeginning();
                };
            }
        });
    </script>
</body>
</html>
